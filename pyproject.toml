[project]
name = "deployment-reliability"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    "torch==2.13.0",
    "numpy==2.5.1",
    "scipy==1.18.0",
    "scikit-learn==1.9.0",
    "transformers==5.14.1",
    "datasets==5.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "matplotlib==3.11.1",
    "nbformat==5.10.4",
    "nbclient==0.11.0",
    "ipykernel==7.3.0",
    "torchvision==0.28.0",
    "pillow==12.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
